<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Slide &amp; Triple · 滑块三消</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Δ16d/T066: HooLey Games 品牌开机动画（FR-038——纯表现层，首次点击/按键可跳过） -->
<div id="splash-screen">
  <div class="splash-brand">
    <div class="splash-title" aria-label="HooLey">
      <span class="splash-ch" data-ch="0">H</span>
      <span class="splash-ch splash-oo" data-ch="1"><i class="oo-ring"></i><i class="oo-eye"></i></span>
      <span class="splash-ch splash-oo" data-ch="2"><i class="oo-ring"></i><i class="oo-eye"></i></span>
      <span class="splash-ch" data-ch="3">l</span>
      <span class="splash-ch" data-ch="4">e</span>
      <span class="splash-ch" data-ch="5">y</span>
    </div>
    <div class="splash-sub">GAMES</div>
  </div>
</div>

<div id="app">
  <!-- Δ19c/T085: 顶部导航栏三区（左: 大厅/设置 · 中: 关卡 X · 右: 棱晶胶囊） -->
  <header id="hud">
    <div class="hud-left">
      <button id="btn-lobby" class="hud-round-btn" type="button" aria-label="返回大厅" title="返回大厅">
        <span class="hud-round-ico" aria-hidden="true">↩</span>
        <span class="hud-round-cap" aria-hidden="true">大厅</span>
      </button>
      <button id="btn-settings" class="hud-round-btn" type="button" aria-label="设置" title="设置">
        <span class="hud-round-ico" aria-hidden="true">⚙️</span>
        <span class="hud-round-cap" aria-hidden="true">设置</span>
      </button>
    </div>
    <div class="hud-center">
      <h1 id="hud-title">关卡 <span id="hud-level-no">1</span></h1>
    </div>
    <div class="hud-right">
      <span id="hud-shards" class="hud-shard-pill" aria-label="棱晶数量">💎 0</span>
    </div>
  </header>

  <!-- Δ19c/T085: IQ 指数状态条（顶栏下方、待消槽正上方——初始 IQ 90） -->
  <div id="iq-bar">
    <div class="iq-pill" id="iq-pill">
      <span class="iq-brain" aria-hidden="true">🧠</span>
      <span class="iq-word">IQ:</span>
      <b id="iq-value">90</b>
      <span class="iq-dot" aria-hidden="true">·</span>
      <span id="iq-title">敏锐直觉</span>
      <span id="iq-delta" class="iq-delta" aria-hidden="true"></span>
    </div>
    <div class="iq-side">
      <span id="hud-lives" aria-label="生命"></span>
      <span id="hud-score">0</span>
      <span id="hud-combo" class="hud-combo"></span>
    </div>
  </div>

  <!-- Δ19c/T085: 顶部 7 格立体待消槽托盘（棋盘正上方——所有飞出牌向此汇聚） -->
  <div id="dock" aria-label="顶部待消槽托盘"></div>

  <div id="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <!-- Δ19d/T086: 底部三大道具（撤销 / 灵犀三消 / 乾坤洗牌——原创 SVG 图标） -->
  <div id="items">
    <button id="item-undo" type="button" class="item-btn item-undo" aria-label="撤销上一步">
      <span class="item-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="presentation">
          <defs>
            <linearGradient id="icoUndo" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#A9FFD9"/><stop offset="0.55" stop-color="#57E0A6"/><stop offset="1" stop-color="#22A971"/>
            </linearGradient>
          </defs>
          <path d="M16 12.5h9.5a11.5 11.5 0 1 1 0 23H20" fill="none" stroke="url(#icoUndo)" stroke-width="5.2" stroke-linecap="round"/>
          <path d="M20.5 4.5 8.5 13.5l12 8.4z" fill="#A9FFD9" stroke="#2E8C5D" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="25.5" cy="24" r="3.1" fill="#F2FFFA" opacity="0.95"/>
        </svg>
      </span>
      <span class="item-count">1</span>
    </button>
    <button id="item-magnet" type="button" class="item-btn item-magnet" aria-label="灵犀三消">
      <span class="item-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="presentation">
          <defs>
            <linearGradient id="icoMagA" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#BFF0FF"/><stop offset="1" stop-color="#5AA8FF"/>
            </linearGradient>
            <linearGradient id="icoMagB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FFF3C4"/><stop offset="1" stop-color="#FFB13D"/>
            </linearGradient>
          </defs>
          <path d="M13.5 10v14.5a10.5 10.5 0 0 0 21 0V10" fill="none" stroke="url(#icoMagA)" stroke-width="6" stroke-linecap="round"/>
          <path d="M10.5 8.5h6.5v6h-6.5zM31 8.5h6.5v6H31z" fill="url(#icoMagB)" stroke="#8A5A12" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M24 20.5 26.4 25l5 .7-3.6 3.5.9 5-4.7-2.4-4.7 2.4.9-5-3.6-3.5 5-.7z" fill="#C9AEFF" stroke="#7A5CD6" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M37.5 22.5l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#FFF9DC"/>
          <path d="M10 26.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="#FFF9DC"/>
          <path d="M37 36l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7z" fill="#FFF9DC"/>
        </svg>
      </span>
      <span class="item-count">1</span>
    </button>
    <button id="item-shuffle" type="button" class="item-btn item-shuffle" aria-label="乾坤洗牌">
      <span class="item-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="presentation">
          <defs>
            <linearGradient id="icoShA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FFE3A8"/><stop offset="0.5" stop-color="#FFB05C"/><stop offset="1" stop-color="#E06A2C"/>
            </linearGradient>
            <linearGradient id="icoShB" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#DFF3FF"/><stop offset="1" stop-color="#6FB8FF"/>
            </linearGradient>
          </defs>
          <path d="M10 16.5c6-6.5 15.5-7 22-1.5" fill="none" stroke="url(#icoShA)" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M38 31.5c-6 6.5-15.5 7-22 1.5" fill="none" stroke="url(#icoShB)" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M33.5 8.5 41 15l-8.6 5.2z" fill="#FFD98A" stroke="#B96A1E" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M14.5 39.5 7 33l8.6-5.2z" fill="#BFE6FF" stroke="#2C6FA8" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M12 8.5c3.5 2 5.6 5.2 6.4 8.8M36 39.5c-3.5-2-5.6-5.2-6.4-8.8" fill="none" stroke="#FFF4D6" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
        </svg>
      </span>
      <span class="item-count">1</span>
    </button>
  </div>

  <!-- Δ19e/T087: 新手教学引导层（非模态——不阻塞棋盘输入） -->
  <div id="tutorial-root" hidden>
    <div id="tutorial-hand" class="tut-hand" aria-hidden="true">👆</div>
    <div class="tut-card" role="status" aria-live="polite">
      <div class="tut-step" id="tutorial-step">1 / 3</div>
      <div class="tut-text" id="tutorial-text"></div>
      <button id="tutorial-skip" class="tut-skip" type="button">跳过</button>
    </div>
  </div>

  <div id="debug-panel" hidden>
    <h3>🛠 评委调试面板</h3>
    <div class="row">
      <label>跳关 <select id="debug-level"></select></label>
    </div>
    <div class="row">
      <button id="debug-reset" type="button">🔄 重置本关</button>
      <button id="debug-hint" type="button">💡 提示下一步</button>
    </div>
    <div class="row">
      <button id="debug-auto" type="button">🤖 自动演示（Auto-Play）</button>
    </div>
    <div id="debug-info" aria-live="polite"></div>
    <label><input type="checkbox" id="debug-mute"> 音效开关</label>
  </div>
</div>

<!-- 固定 classic script 加载序（D-01）：profile(Δ16c) → levels → RulesEngine → GameState → bestiary(Δ14) → backdrops(Δ14) → BoardRenderer → SoundManager → splash(Δ16d) → modals(Δ16e) → lobby(Δ16e) → result(Δ16g) → fail(Δ16g) → tutorial(Δ19e) → main -->
<script defer src="src/core/profile.js"></script>
<script defer src="src/data/levels.js"></script>
<script defer src="src/core/RulesEngine.js"></script>
<script defer src="src/core/GameState.js"></script>
<script defer src="src/render/bestiary.js"></script>
<script defer src="src/render/backdrops.js"></script>
<script defer src="src/render/BoardRenderer.js"></script>
<script defer src="src/audio/SoundManager.js"></script>
<script defer src="src/ui/splash.js"></script>
<script defer src="src/ui/modals.js"></script>
<script defer src="src/ui/lobby.js"></script>
<script defer src="src/ui/result.js"></script>
<script defer src="src/ui/fail.js"></script>
<script defer src="src/ui/tutorial.js"></script>
<script defer src="src/main.js"></script>
</body>
</html>
